name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experimental
  pull_request:
    branches:
      - main
      - experimental

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter's result rather than cancelling the rest at the
      # first failure; with a five-version matrix, "3.14 broke" and "3.10 through
      # 3.14 all broke" want different responses.
      fail-fast: false
      matrix:
        # Must cover everything requires-python promises in pyproject.toml
        # (">= 3.10,<3.15"). 3.13 and 3.14 were shipped untested until now.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Skip CI if 'skip ci' is contained in latest commit message
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:

    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run pre-test scripts
      run: |
        python tests/gen_test_data.py

    - name: Test with pytest
      run: |
        pytest

    - name: Upload coverage to Codecov  
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests

